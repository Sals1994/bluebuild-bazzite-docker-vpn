modules:
  # Docker CE from official repo
  - type: dnf
    repos:
      keys:
        - https://download.docker.com/linux/fedora/gpg
      files:
        - https://download.docker.com/linux/fedora/docker-ce.repo
    install:
      packages:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
      allow-erasing: true

  # Enable Docker via socket activation (starts on-demand)
  - type: systemd
    system:
      enabled:
        - docker.socket
