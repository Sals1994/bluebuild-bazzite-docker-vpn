---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: bazzite-docker-vpn-nvidia
description: Bazzite with Docker CE and NordVPN, and nothing else. NVIDIA open kernel modules (Turing / RTX 2000+).

base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: stable

modules:
  - from-file: common/common.yml

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
